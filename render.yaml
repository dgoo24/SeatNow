services:
  - type: web
    name: seatnow-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: seatnow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: seatnow-cache
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://seatnow-3nx3g79dr4dx5teqsi2fha.streamlit.app
      - key: GTFS_URL
        value: https://download.gtfs.de/germany/fv_free/latest.zip
      - key: GTFS_SOURCE
        value: ./gtfs-data
      - key: REALTIME_PROVIDER
        value: db-rest
      - key: INVENTORY_PROVIDER
        value: simulated
      - key: SEAT_HOLD_TTL_SECONDS
        value: "600"
      - key: ADMIN_EMAIL
        value: admin@trenes.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_EMAIL
        value: demo@trenes.local
      - key: DEMO_PASSWORD
        value: demo1234

  - type: keyvalue
    name: seatnow-cache
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: seatnow-db
    plan: free
    region: frankfurt
    databaseName: seatnow
    user: seatnow
