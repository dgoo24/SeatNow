# Thema "SeatNow" · Deutsche-Bahn-Optik: Signalrot, Anthrazit, Stahlsilber.

[theme]
base = "dark"
primaryColor = "#e2001a"
backgroundColor = "#0b0d10"
secondaryBackgroundColor = "#171b22"
textColor = "#f3f5f8"
linkColor = "#ff5f6e"
codeTextColor = "#e9edf2"
codeBackgroundColor = "#0f1216"
borderColor = "#2a3039"
dataframeBorderColor = "#2a3039"
dataframeHeaderBackgroundColor = "#171b22"
baseRadius = "0.7rem"
buttonRadius = "0.7rem"
showWidgetBorder = true
linkUnderline = false
baseFontSize = 16

greenColor = "#35c07a"
orangeColor = "#ffb020"
redColor = "#ff4d5e"
blueColor = "#5ea9e8"
violetColor = "#a78bfa"
grayColor = "#96a0ae"

headingFontSizes = ["32px", "26px", "21px", "18px", "16px", "14px"]
headingFontWeights = [700, 700, 650, 600, 600, 500]

font = "'Barlow':https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap"
headingFont = "'Barlow Semi Condensed':https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap"

[theme.sidebar]
backgroundColor = "#0f1216"
secondaryBackgroundColor = "#14181e"
borderColor = "#242a33"
